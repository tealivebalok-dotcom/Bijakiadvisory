<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; }

  .logo-banner {
    width: 820px;
    height: 312px;
    background: linear-gradient(135deg, #0F2044 0%, #1a3a6e 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .left-panel {
    width: 280px;
    height: 312px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .left-panel::after {
    content: '';
    position: absolute;
    right: -20px;
    top: 0;
    width: 40px;
    height: 312px;
    background: #0F2044;
    transform: skewX(-4deg);
    z-index: 3;
  }

  .right-content {
    flex: 1;
    padding: 20px 30px 20px 40px;
    position: relative;
    z-index: 2;
  }

  .wave-mark {
    width: 80px;
    height: 80px;
    margin-bottom: 12px;
  }

  .company-name {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 8px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .advisory {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #0EA5A0;
    letter-spacing: 10px;
    margin-bottom: 12px;
  }

  .gold-divider {
    width: 100px;
    height: 2px;
    background: #C9A84C;
    border-radius: 2px;
    margin-bottom: 12px;
  }

  .reg-line {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
  }

  .tagline {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .sub-tagline {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    border-left: 3px solid #0EA5A0;
  }

  .stat {
    display: flex;
    flex-direction: column;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
  }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-size: 8px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .circle-accent {
    position: absolute;
    top: -60px;
    right: 200px;
    width: 200px;
    height: 200px;
    background: #0EA5A0;
    opacity: 0.06;
    border-radius: 50%;
    z-index: 1;
  }

  .circle-accent-2 {
    position: absolute;
    bottom: -80px;
    right: 80px;
    width: 160px;
    height: 160px;
    background: #C9A84C;
    opacity: 0.05;
    border-radius: 50%;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="logo-banner">
  <div class="circle-accent"></div>
  <div class="circle-accent-2"></div>

  <div class="left-panel">
    <!-- Wave Brand Mark SVG -->
    <svg class="wave-mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 65 L0 15 Q0 10 6 10 L22 10 Q38 10 38 28 Q38 42 24 45 L22 46 Q38 48 38 62 Q38 75 22 75 L6 75"
            fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 62 L50 54 L44 66"
            fill="none" stroke="#C9A84C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="company-name">BIJAK I</div>
    <div class="advisory">Advisory</div>
    <div class="gold-divider"></div>
    <div class="reg-line">SSM: 202601031809(1693904-A)</div>
  </div>

  <div class="right-content">
    <div class="tagline">Your Business.<br>Our Expertise.</div>
    <div class="sub-tagline">Company secretarial done right — no agents, no middlemen.</div>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-num">18+</div>
        <div class="stat-label">Years Finance</div>
      </div>
      <div class="stat">
        <div class="stat-num">12+</div>
        <div class="stat-label">Years Accounting</div>
      </div>
      <div class="stat">
        <div class="stat-num">300+</div>
        <div class="stat-label">Clients Served</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
