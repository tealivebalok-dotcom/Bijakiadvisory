<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIJAK I Advisory — Facebook Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; }

  .cover {
    width: 820px;
    height: 312px;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* LEFT PANEL — Navy */
  .left {
    width: 38%;
    height: 312px;
    background: #0F2044;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  /* Diagonal cut divider */
  .left::after {
    content: '';
    position: absolute;
    right: -30px;
    top: 0;
    width: 60px;
    height: 312px;
    background: #0F2044;
    transform: skewX(-6deg);
    z-index: 3;
  }

  .left-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    z-index: 4;
  }

  .left-logo .brand-mark {
    width: 52px;
    height: 52px;
    margin-bottom: 8px;
  }

  .left-logo .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 6px;
    line-height: 1;
  }

  .left-logo .brand-sub {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
    color: #0EA5A0;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Gold accent line */
  .gold-line {
    width: 40px;
    height: 3px;
    background: #C9A84C;
    margin-top: 14px;
    border-radius: 2px;
  }

  /* RIGHT PANEL — White */
  .right {
    flex: 1;
    height: 312px;
    background: #F4F7FB;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 30px 20px 40px;
    position: relative;
  }

  /* Abstract teal shape top right */
  .right::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    width: 160px;
    height: 160px;
    background: #0EA5A0;
    opacity: 0.07;
    border-radius: 50%;
  }

  /* Abstract navy circle bottom right */
  .right::after {
    content: '';
    position: absolute;
    bottom: -40px;
    right: 60px;
    width: 120px;
    height: 120px;
    background: #0F2044;
    opacity: 0.06;
    border-radius: 50%;
  }

  .tagline-main {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #0F2044;
    line-height: 1.2;
    margin-bottom: 10px;
    position: relative;
    z-index: 2;
  }

  .tagline-sub {
    font-size: 11px;
    font-weight: 500;
    color: #6B7280;
    line-height: 1.6;
    max-width: 320px;
    margin-bottom: 16px;
    position: relative;
    z-index: 2;
  }

  .cta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 2;
  }

  .cta-text {
    font-size: 11px;
    font-weight: 700;
    color: #0EA5A0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .cta-arrow {
    font-size: 14px;
    color: #0EA5A0;
    font-weight: 700;
  }

  /* STATS BAR — Bottom strip */
  .stats-bar {
    width: 100%;
    height: 52px;
    background: #0EA5A0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    position: absolute;
    bottom: 0;
    left: 0;
    z-index: 5;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px;
    border-right: 1px solid rgba(255,255,255,0.3);
  }

  .stat:last-child {
    border-right: none;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1;
  }

  .stat-label {
    font-size: 8px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Wave divider top of stats */
  .stats-bar::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(to right, #0EA5A0 38%, #F4F7FB 38%);
  }
</style>
</head>
<body>
<div class="cover">

  <!-- LEFT: Navy brand panel -->
  <div class="left">
    <div class="left-logo">
      <!-- Wave brand mark SVG -->
      <svg class="brand-mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 65 L20 15 Q20 10 26 10 L42 10 Q58 10 58 28 Q58 42 44 45 L42 46 Q58 48 58 62 Q58 75 42 75 L26 75"
              fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M58 62 L70 54 L64 66"
              fill="none" stroke="#C9A84C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-name">BIJAK I</div>
      <div class="brand-sub">Advisory</div>
      <div class="gold-line"></div>
    </div>
  </div>

  <!-- RIGHT: Content panel -->
  <div class="right">
    <div class="tagline-main">Your Business.<br>Our Expertise.</div>
    <div class="tagline-sub">Company secretarial done right — no agents, no middlemen. Just experienced people who care about getting it right.</div>
    <div class="cta-row">
      <span class="cta-text">Start Your Company Today</span>
      <span class="cta-arrow">→</span>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-num">18+</div>
      <div class="stat-label">Years Finance</div>
    </div>
    <div class="stat">
      <div class="stat-num">12+</div>
      <div class="stat-label">Years Accounting</div>
    </div>
    <div class="stat">
      <div class="stat-num">300+</div>
      <div class="stat-label">Companies Served</div>
    </div>
  </div>

</div>
</body>
</html>
